; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;set default_envs to whichever board(s) you use. Build/Run/etc processes those envs
default_envs =
  esp32dev

[env]
; Global data for all [env:***]
framework = arduino
lib_ldf_mode = deep
monitor_speed = 115200
lib_deps =
  SignalK/SensESP @ ^2.7.2
  sensesp/OneWire @ 2.0.0
  ; Pin ReactESP to 2.x — 3.x removed the static app pointer that SensESP 2.x relies on
  mairas/ReactESP @ ~2.1.0

  ; OneWire and sensor libraries
  OneWire@^2.0.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit Unified Sensor @ ^1.1.9

  ; Async libraries for ESP32
  me-no-dev/AsyncTCP
  me-no-dev/ESPAsyncWebServer

[espressif32_base]
;this section has config items common to all ESP32 boards
; Pinned to last release that ships Arduino-ESP32 2.x — SensESP 2.x requires the old ledcSetup/ledcAttachPin API removed in 3.x
platform = espressif32@6.5.0
build_unflags =
  -Werror=reorder
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder

[env:esp32dev]
extends = espressif32_base
board = esp32dev
build_flags =
  -D LED_BUILTIN=2
  ; Uncomment the following to disable debug output altogether
  ;-D DEBUG_DISABLED
  ; Uncomment the following to enable the remote debug telnet interface on port 23
  ;-D REMOTE_DEBUG

;; Uncomment and change these if PlatformIO can't auto-detect the ports
;upload_port = /dev/cu.usb*
;monitor_port = /dev/cu.usb*

;; Uncomment the following lines to use Over-the-air (OTA) Updates
;upload_protocol = espota
;upload_port = IP_ADDRESS_OF_ESP_HERE
;upload_flags =
;  --auth=YOUR_OTA_PASSWORD

lib_ignore =
  ; Ignore the ESP8266-only library that may be pulled in accidentally
  ESPAsyncTCP